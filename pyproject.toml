[project]
name = "pycpufreq"
version = "1.0.0"
description = "Python library and CLI tool to manage and monitor CPU frequencies and turbo state"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "turulomio", email = "turulomio@yahoo.es" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pycpufreq = "pycpufreq.commands:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.poe.tasks]
translate = { script = "pycpufreq.poethepoet:translate", help = "Extract, update and compile gettext catalogs" }
test = { cmd = "pytest", help = "Run test suite" }
release = { script = "pycpufreq.poethepoet:release", help = "Print instructions for releasing a new version" }


