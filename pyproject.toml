[project]
name = "pycpufreq"
version = "0.1.0"
description = "Python library and CLI tool to manage and monitor CPU frequencies and turbo state"
readme = "README.md"
authors = [
    { name = "turulomio", email = "turulomio@yahoo.es" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pycpufreq = "pycpufreq:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
